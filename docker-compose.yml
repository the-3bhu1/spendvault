services:
  spendvault:

    build: .

    container_name: spendvault

    ports:
      - "5173:5173"

    volumes:
      - .:/app
      - /app/node_modules

    stdin_open: true
    tty: true

  # Release-APK builder. Not part of the dev stack. Start it through the wrapper, which fills in the
  # two variables below for this machine:
  #
  #   npm run release:apk -- --docker
  #
  # It exits when the build finishes. Setup and keystore handling: docs/RELEASE.md
  spendvault-apk:

    build:
      context: .
      dockerfile: Dockerfile.android

    # The aapt2 binary Gradle downloads exists only for x86-64 Linux, so the builder is always amd64:
    # native on Windows and Intel, emulated by Docker Desktop on an Apple-silicon Mac.
    platform: linux/amd64

    volumes:
      - .:/app
      # The host's node_modules is built for the host OS; the Linux build gets its own.
      - apk-node-modules:/app/node_modules
      - npm-cache:/root/.npm
      # Gradle downloads hundreds of MB on a cold run; later builds reuse them.
      - gradle-cache:/root/.gradle
      # Every Gradle state and build directory lives in a volume, not in the checkout. The container's
      # /app/... paths then never mix with a host build's paths in android/.gradle or android/**/build,
      # so switching between this and an Android Studio build can't confuse either — and the build
      # skips writing through the (slow, on Windows) bind mount. The APK is copied out to release/.
      - apk-android-dotgradle:/app/android/.gradle
      - apk-android-dotkotlin:/app/android/.kotlin
      - apk-android-build:/app/android/build
      - apk-app-build:/app/android/app/build
      # Not android/capacitor-cordova-android-plugins/build: `cap sync` deletes and regenerates that whole
      # folder on every build (host or container alike), so nothing in it can go stale — and a volume
      # mounted inside it makes the delete fail with EBUSY.
      # This machine's signing folder (keystore + signing.properties), read-only, at the path where
      # android/app/build.gradle looks: <home>/.spendvault. Started without the wrapper, it mounts the
      # gitignored ./.keys instead and the build stops with "No release signing configured".
      - ${SV_SIGNING_DIR:-./.keys}:/root/.spendvault:ro

    environment:
      SV_APK_NAME: ${SV_APK_NAME:-app-release.apk}

volumes:
  apk-node-modules:
  npm-cache:
  gradle-cache:
  apk-android-dotgradle:
  apk-android-dotkotlin:
  apk-android-build:
  apk-app-build:
