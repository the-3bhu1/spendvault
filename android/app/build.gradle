apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Release signing is read from ONE of two sources, in this order:
//
//   1. android/key.properties — the local desktop setup. Gitignored, so it exists only on the
//      machine that created it and never travels with a clone.
//   2. SV_KEYSTORE_* environment variables — for container and CI builds. A bind-mounted working
//      tree makes writing key.properties a bad idea: it would leave credentials and container-only
//      paths behind on the host after the build. See docs/RELEASE.md.
//
// With NEITHER present the release build still succeeds, but produces an UNSIGNED apk that Android
// refuses to install over an existing install. That used to happen silently; it now warns loudly
// below, because for this app a reinstall means wiping localStorage — which is where all the user's
// data lives.
def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()

if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def envStoreFile = System.getenv('SV_KEYSTORE_FILE')
def hasEnvKeystore = !hasKeystoreProperties && envStoreFile != null && !envStoreFile.trim().isEmpty()
def hasSigning = hasKeystoreProperties || hasEnvKeystore

def signingStoreFile = hasEnvKeystore ? envStoreFile : keystoreProperties['storeFile']
def signingStorePassword = hasEnvKeystore ? System.getenv('SV_KEYSTORE_PASSWORD') : keystoreProperties['storePassword']
def signingKeyAlias = hasEnvKeystore ? System.getenv('SV_KEY_ALIAS') : keystoreProperties['keyAlias']
def signingKeyPassword = hasEnvKeystore ? System.getenv('SV_KEY_PASSWORD') : keystoreProperties['keyPassword']

if (!hasSigning) {
    logger.warn('')
    logger.warn('*** NO RELEASE SIGNING CONFIGURED ***')
    logger.warn('    Neither android/key.properties nor SV_KEYSTORE_FILE was found.')
    logger.warn('    assembleRelease will emit app-release-UNSIGNED.apk, which cannot be installed')
    logger.warn('    over an existing SpendVault install. See docs/RELEASE.md.')
    logger.warn('')
}

android {
    namespace "com.spendvault.app"
    compileSdk rootProject.ext.compileSdkVersion
    signingConfigs {
        if (hasSigning) {
            release {
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
            }
        }
    }
    defaultConfig {
        applicationId "com.spendvault.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
configurations.all { resolutionStrategy { force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"; force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22" } }
