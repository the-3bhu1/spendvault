apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Release signing is read from the FIRST of these that exists:
//
//   1. SV_KEYSTORE_* environment variables — for CI, where secrets arrive as variables.
//   2. <home>/.spendvault/signing.properties — the per-machine setup (docs/RELEASE.md). It lives
//      OUTSIDE the repo, so no clone, branch or Docker image can carry it. Its storeFile is resolved
//      against that folder, so the same file works on macOS, on Windows, and inside the Docker
//      builder, which mounts the folder at /root/.spendvault.
//   3. android/key.properties — the older per-checkout setup. Still honoured so a machine set up
//      that way keeps building, but it keeps secrets inside the working tree; `npm run release:setup`
//      moves it to (2).
//
// A release build with none of them now FAILS rather than emitting app-release-unsigned.apk: Android
// refuses to install that over an existing SpendVault, and for this app a reinstall wipes
// localStorage — which is where all the user's data lives. -Psv.allowUnsigned=true opts out.
def loadProperties = { File f ->
    def p = new Properties()
    f.withInputStream { p.load(it) }
    p
}
def machineSigningFile = new File(System.getProperty('user.home'), '.spendvault/signing.properties')
def keystorePropertiesFile = rootProject.file('key.properties')
def envStoreFile = System.getenv('SV_KEYSTORE_FILE')

def signing = null
if (envStoreFile?.trim()) {
    signing = [source: 'SV_KEYSTORE_* environment variables', storeFile: file(envStoreFile),
               storePassword: System.getenv('SV_KEYSTORE_PASSWORD'), keyAlias: System.getenv('SV_KEY_ALIAS'),
               keyPassword: System.getenv('SV_KEY_PASSWORD')]
} else if (machineSigningFile.exists()) {
    def p = loadProperties(machineSigningFile)
    def store = new File(p['storeFile'] ?: 'spendvault-release-key.jks')
    signing = [source: machineSigningFile.path,
               storeFile: store.absolute ? store : new File(machineSigningFile.parentFile, store.path),
               storePassword: p['storePassword'], keyAlias: p['keyAlias'], keyPassword: p['keyPassword']]
} else if (keystorePropertiesFile.exists()) {
    def p = loadProperties(keystorePropertiesFile)
    signing = [source: 'android/key.properties', storeFile: file(p['storeFile']),
               storePassword: p['storePassword'], keyAlias: p['keyAlias'], keyPassword: p['keyPassword']]
}

// The certificate every SpendVault release has been signed with. Not a secret — it is inside every
// APK. Checked before a release is packaged, so a machine holding a different keystore (a fresh one
// generated by mistake, the wrong file copied over) fails here instead of producing an APK that only
// installs after an uninstall — which wipes the user's data.
def RELEASE_CERT_SHA256 = 'b3d34d28cb8e82f70e24498c84300b8e3f1f9be4797e381ecb15942ce09460b4'

gradle.taskGraph.whenReady { graph ->
    if (!graph.hasTask(':app:packageRelease') && !graph.hasTask(':app:signReleaseBundle')) return
    if (signing == null) {
        if (project.findProperty('sv.allowUnsigned') == 'true') {
            logger.warn('*** Building an UNSIGNED release (-Psv.allowUnsigned=true). It will not install over SpendVault. ***')
            return
        }
        throw new GradleException('No release signing configured: no SV_KEYSTORE_FILE, no ' +
            "${machineSigningFile.path}, no android/key.properties. Run `npm run release:setup` " +
            '(docs/RELEASE.md), or pass -Psv.allowUnsigned=true for an APK that cannot upgrade an install.')
    }
    if (!signing.storeFile.exists()) {
        throw new GradleException("Keystore not found at ${signing.storeFile} (from ${signing.source}).")
    }
    def ks
    try {
        ks = java.security.KeyStore.getInstance(signing.storeFile, (signing.storePassword ?: '').toCharArray())
    } catch (Exception e) {
        throw new GradleException("Could not open ${signing.storeFile} — is storePassword in ${signing.source} right? (${e.message})")
    }
    def cert = ks.getCertificate(signing.keyAlias as String)
    if (cert == null) {
        throw new GradleException("No key aliased '${signing.keyAlias}' in ${signing.storeFile} (from ${signing.source}).")
    }
    try {
        ks.getKey(signing.keyAlias as String, (signing.keyPassword ?: '').toCharArray())
    } catch (Exception e) {
        throw new GradleException("keyPassword in ${signing.source} does not unlock '${signing.keyAlias}' (${e.message})")
    }
    def actual = java.security.MessageDigest.getInstance('SHA-256').digest(cert.encoded).encodeHex().toString()
    if (actual != RELEASE_CERT_SHA256) {
        throw new GradleException("${signing.storeFile} is NOT the SpendVault release key.\n" +
            "    expected certificate SHA-256 ${RELEASE_CERT_SHA256}\n" +
            "    this keystore has           ${actual}\n" +
            '    An APK signed with it cannot update an installed SpendVault. Copy the real keystore to this machine.')
    }
    logger.lifecycle("Release signing: ${signing.source} (certificate verified)")
}

// The version shown in the app (APP_VERSION in src/utils.ts) is the one source of truth: versionName
// is it without the "v", and versionCode packs it as MAJOR·10000 + MINOR·100 + PATCH, so v2.1.0 is
// 20100. Play rejects an upload whose versionCode isn't above the last one, and Android refuses to
// install over a higher one — so bumping APP_VERSION is all a release needs, and it can never go back.
def appVersionMatch = (rootProject.file('../src/utils.ts').text =~ /export const APP_VERSION = 'v(\d+)\.(\d+)\.(\d+)'/)
if (!appVersionMatch.find()) {
    throw new GradleException("Could not read APP_VERSION = 'vMAJOR.MINOR.PATCH' from src/utils.ts.")
}
def (appMajor, appMinor, appPatch) = (1..3).collect { appVersionMatch.group(it) as int }
if (appMinor > 99 || appPatch > 99) {
    throw new GradleException("APP_VERSION minor and patch must stay under 100 to fit versionCode.")
}
def appVersionCode = appMajor * 10000 + appMinor * 100 + appPatch
def appVersionName = "${appMajor}.${appMinor}.${appPatch}"

android {
    namespace "com.spendvault.app"
    compileSdk rootProject.ext.compileSdkVersion
    signingConfigs {
        if (signing != null) {
            release {
                keyAlias signing.keyAlias
                keyPassword signing.keyPassword
                storeFile signing.storeFile
                storePassword signing.storePassword
            }
        }
    }
    defaultConfig {
        applicationId "com.spendvault.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signing != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
configurations.all { resolutionStrategy { force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"; force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22" } }
