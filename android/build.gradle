// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // The Kotlin version the app compiles with, and the one Capacitor plugins written in Kotlin read
    // (rootProject.ext.kotlin_version) — one number, so the two can't drift apart again.
    ext.kotlin_version = '2.4.21'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.6.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
